name: release-bootstrap-v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify trusted transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .bootstrap-v3/chunk-00)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-01)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-02)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-03a)" -eq 3000
          test "$(wc -c < .bootstrap-v3/chunk-03b)" -eq 3000
          test "$(wc -c < .bootstrap-v3/chunk-04)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-05)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-06)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-07a)" -eq 3000
          test "$(wc -c < .bootstrap-v3/chunk-07b)" -eq 3000
          test "$(wc -c < .bootstrap-v3/chunk-08)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-09)" -eq 6000
          test "$(wc -c < .bootstrap-v3/chunk-10)" -eq 980

          cat \
            .bootstrap-v3/chunk-00 \
            .bootstrap-v3/chunk-01 \
            .bootstrap-v3/chunk-02 \
            .bootstrap-v3/chunk-03a \
            .bootstrap-v3/chunk-03b \
            .bootstrap-v3/chunk-04 \
            .bootstrap-v3/chunk-05 \
            .bootstrap-v3/chunk-06 \
            .bootstrap-v3/chunk-07a \
            .bootstrap-v3/chunk-07b \
            .bootstrap-v3/chunk-08 \
            .bootstrap-v3/chunk-09 \
            .bootstrap-v3/chunk-10 > /tmp/archi-release.b64

          test "$(wc -c < /tmp/archi-release.b64)" -eq 60980
          base64 --decode /tmp/archi-release.b64 > /tmp/archi-release.tar.gz
          gzip -t /tmp/archi-release.tar.gz
          ARCHIVE_SHA="$(sha256sum /tmp/archi-release.tar.gz | awk '{print $1}')"
          test "${#ARCHIVE_SHA}" -eq 64
          echo "Validated archive SHA-256: ${ARCHIVE_SHA}"

          tar -tzf /tmp/archi-release.tar.gz > /tmp/archi-release.list
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/archi-release.list; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          grep -qx 'README.md' /tmp/archi-release.list
          grep -qx 'pyproject.toml' /tmp/archi-release.list
          grep -qx 'archi_studio/cli.py' /tmp/archi-release.list
          grep -qx '.github/workflows/test.yml' /tmp/archi-release.list

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-base origin/main

          # GitHub's workflow token cannot create/update workflow definitions without
          # the separate workflows permission. Preserve the currently authorized
          # workflow directory during the source-only publication. The connector will
          # install the final release-gate workflow after this bootstrap commit lands.
          mkdir -p /tmp/archi-current-github
          cp -a .github/workflows /tmp/archi-current-github/workflows

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/archi-release.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/archi-current-github/workflows .github/workflows

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Archi Studio source baseline"
          git push origin HEAD:main
