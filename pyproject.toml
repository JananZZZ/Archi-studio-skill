[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-studio-skill"
version = "1.1.0"
description = "Agent-first architecture diagram studio: intake, questionnaire, semantic modeling, auto-layout, quality optimization, interactive editing, and SVG/PNG/PDF export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JananZZZ"}]
dependencies = []

[project.optional-dependencies]
render = ["cairosvg>=2.7"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "playwright>=1.45", "PyMuPDF>=1.24", "cairosvg>=2.7"]

[project.scripts]
archi-studio = "archi_studio.cli:main"

[tool.setuptools]
packages = ["archi_studio"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
